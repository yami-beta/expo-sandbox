name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Generate Expo types
        run: pnpm --dir apps/sandbox run generate-types

      - name: Run Oxlint
        run: |
          pnpm exec oxlint --type-aware --type-check --format=github apps/sandbox
          pnpm exec oxlint --type-aware --type-check --format=github packages/tooling

      - name: Run expo lint
        run: pnpm --dir apps/sandbox run lint:expo

      - name: Check formatting
        run: |
          status=0
          for dir in apps/sandbox packages/tooling; do
            files=$(pnpm exec oxfmt "$dir" --list-different) || status=1
            if [ -n "$files" ]; then
              while IFS= read -r f; do
                [ -n "$f" ] && echo "::error file=${f}::Not formatted. Run \`pnpm run format\` in ${dir} to fix."
              done <<< "$files"
            fi
          done
          exit $status

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Run tests
        run: pnpm -r run test
