name: e2e-main

on:
  push:
    branches: [main]
    paths:
      - 'apps/sandbox/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/e2e-main.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: false

env:
  # install.sh が cli- を付与するため数値のみを指定（再現性のためバージョン固定。e2e.yml と同一値）
  MAESTRO_VERSION: '2.6.1'
  ANDROID_API_LEVEL: '34'
  AVD_NAME: e2e

jobs:
  # Dev Client を含まない release ビルド（eas.json の e2e プロファイル / 埋め込み JS）を
  # eas build --local でビルドし、emulator に install した上で Maestro E2E を実行する。
  # e2e.yml（PRごと、Dev Client + Metro 接続）とはビルド経路（profile / debug vs release）が
  # 根本的に異なるため、ジョブは分ける。
  # E2E_BUILD は設定しない。設定すると apps/sandbox/app.config.ts が expo-dev-client plugin を
  # 有効化し、release / 埋め込み JS のビルドに Dev Client が混入するため。
  # dependabot が @dependabot merge 等で直接 main に push した場合、actor が dependabot[bot]
  # になり secrets.EXPO_TOKEN が渡らず setup-eas が明示エラーで落ちる。main の E2E が
  # 恒常的に失敗してノイズになるのを避けるため、このケースはジョブごと skip する
  # （e2e.yml の dependabot 除外と同様の意図）。
  e2e-android:
    name: E2E (Android / main)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Setup EAS
        uses: ./.github/actions/setup-eas
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM を有効化し emulator のハードウェアアクセラレーションを使う（起動高速化）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest にプリインストール済みの Android SDK ツールで emulator を用意する
      # （サードパーティ Action は使わない方針）
      - name: Install Android system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${ANDROID_API_LEVEL};google_atd;x86_64" > /dev/null
          # adb / emulator を PATH に通す
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          # avdmanager の作成先と emulator の検索先を統一する（runner 既定はずれることがある）。
          # runner コンテキストは job の env: では使えないため $GITHUB_ENV 経由で後続 step に渡す
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/avd"

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${ANDROID_API_LEVEL};google_atd;x86_64" \
            --device "pixel_6"

      # eas.json の e2e プロファイル（developmentClient: false / release / lintVitalRelease 除外）で
      # ビルドする。E2E_DEFAULT_LOCALE のみ設定し E2E_BUILD は設定しない（上記コメント参照）。
      - name: Build Android APK (eas build --local, e2e profile)
        env:
          # x86_64 のみビルドして emulator の arch と一致させる（ビルド時間短縮）
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
          # E2E ビルドはアプリの言語既定値を ja に固定する（emulator ロケールは既定 en-US のまま）。
          # app.config.ts が extra.e2eDefaultLocale に埋め込み、i18n/locale.ts の
          # getStoredLocalePreference() の（保存値が無いときの）フォールバックとして参照される。
          E2E_DEFAULT_LOCALE: ja
        run: |
          eas build --local --profile e2e --platform android \
            --non-interactive --output ./build-output/sandbox-e2e.apk
        working-directory: apps/sandbox

      - name: Start emulator and wait for boot
        run: |
          # emulator をバックグラウンド起動（テスト端末ロケールは既定の en-US を使う）
          # CI 用の軽量イメージ（google_atd）を使い、release ビルド初回起動時の CPU 負荷で
          # SystemUI/Launcher が ANR するのを抑える（e2e.yml と同じ対策）。余裕のため RAM/コアも増やす。
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -memory 6144 -cores 4 &

          # boot 完了を待つ（最大 5 分）
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'

          # emulator のロケールは既定（en-US）のまま。アプリの表示言語は E2E_DEFAULT_LOCALE=ja
          # により ja に固定されるため、adb root + setprop によるロケール固定・フレームワーク再起動は不要。

          # PackageManager が応答するまで待ち、maestro driver の起動失敗（gRPC UNAVAILABLE）を防ぐ
          timeout 120 bash -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 2; done'
          adb shell input keyevent 82 || true   # ロック画面を解除
          sleep 10                                # system service 安定化の猶予

          # 操作の安定化のためアニメーションを無効化
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      # アプリの起動は行わない。apps/sandbox/.maestro/smoke.yaml の先頭が launchApp であり、
      # maestro test 自体が起動を担う（release / 埋め込み JS のため Metro も不要。install 済みで
      # あれば launchApp が起動できる）。
      - name: Install app
        run: adb install -r apps/sandbox/build-output/sandbox-e2e.apk

      - name: Run Maestro E2E
        run: |
          # 失敗時のスクショ/ログは maestro の --debug-output（maestro-debug/）に出力される
          maestro test apps/sandbox/.maestro/ --format junit --output maestro-report.xml --debug-output ./maestro-debug

      # maestro 失敗時も画面状態を確実に記録する（maestro --debug-output が空のことがあるため、
      # スクショ・ロケール・前面 activity・UI 階層テキストを adb で直接取得する）
      - name: Capture device diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          adb exec-out screencap -p > "$RUNNER_TEMP/diag/screen.png" 2>/dev/null || true
          # emulator 側ロケールの記録（既定 en-US のはず。アプリ表示言語は E2E_DEFAULT_LOCALE=ja
          # で固定しており emulator ロケールとは独立。失敗解析時に環境を確認するために残す）
          {
            echo "persist.sys.locale=$(adb shell getprop persist.sys.locale | tr -d '\r')"
            echo "ro.product.locale=$(adb shell getprop ro.product.locale | tr -d '\r')"
          } > "$RUNNER_TEMP/diag/locale.txt" 2>/dev/null || true
          adb shell dumpsys activity activities 2>/dev/null | tr -d '\r' | grep -iE "topResumedActivity|mResumedActivity" > "$RUNNER_TEMP/diag/activity.txt" || true
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml "$RUNNER_TEMP/diag/ui.xml" >/dev/null 2>&1 || true
          echo "=== locale ==="; cat "$RUNNER_TEMP/diag/locale.txt" 2>/dev/null || true
          echo "=== top activity ==="; cat "$RUNNER_TEMP/diag/activity.txt" 2>/dev/null || true
          echo "=== UI に表示中のテキスト（抜粋） ==="; grep -oE 'text="[^"]+"' "$RUNNER_TEMP/diag/ui.xml" 2>/dev/null | head -40 || true

      # 成功・失敗にかかわらずレポート・スクショ/録画/ログ・診断（画面状態）・APK を保存する
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ github.sha }}
          path: |
            maestro-report.xml
            maestro-debug
            apps/sandbox/build-output/sandbox-e2e.apk
            ${{ runner.temp }}/diag
          retention-days: 7
          if-no-files-found: warn
          # 同一コミットへの re-run で同名アーティファクトが既に存在する場合の 409 Conflict を避ける
          overwrite: true

  # PR の e2e.yml が使う dev-client debug APK のビルドキャッシュを main で温める。
  # GitHub Actions のキャッシュはブランチスコープで、新規 PR ブランチが復元できるのは
  # default ブランチ（main）が書き込んだキャッシュのみ。このジョブが main への push ごとに
  # e2e.yml と同一の fingerprint / 同一 profile（development）で APK を eas build --local し
  # actions/cache（同一キー e2e-android-devclient-apk-<hash>）へ保存することで、ネイティブ変更の
  # 無い（JS のみの）PR が初回プッシュからヒットしてビルドを丸ごと省略できるようにする。
  # 上の release e2e ジョブとは目的（release 検証 vs dev-client キャッシュ温め）が異なるため
  # 独立したジョブとし、emulator / Metro / maestro は使わない（build のみ）。
  warm-devclient-cache:
    name: Warm dev-client APK cache
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # build のみ（emulator/maestro なし）だが、キャッシュミス時の初回フルビルドに余裕を持たせる
    timeout-minutes: 60
    env:
      APK_PATH: apps/sandbox/build-output/sandbox-e2e-devclient.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Setup EAS
        uses: ./.github/actions/setup-eas
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      # e2e.yml と同一のコマンド・env で fingerprint を計算する（ハッシュ一致が初回ヒットの前提）。
      # @expo/fingerprint（pnpm-lock.yaml 固定）を API 直呼びで使い、EAS 認証・ネットワーク不要かつ
      # ランをまたいで決定的にする。詳細は e2e.yml の同ステップのコメント参照。
      - name: Compute native fingerprint
        id: fp
        working-directory: apps/sandbox
        env:
          E2E_BUILD: 'true'
          E2E_DEFAULT_LOCALE: ja
        run: |
          HASH="$(node -e "require('@expo/fingerprint').createProjectHashAsync(process.cwd(), { platforms: ['android'] }).then((h) => process.stdout.write(h)).catch((e) => { console.error(e); process.exit(1); })")"
          if [ -z "$HASH" ]; then
            echo "::error::native fingerprint の取得に失敗しました" >&2
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "native fingerprint: $HASH"

      # e2e.yml と同一キー（arch も一致させる）。既にこの fingerprint がキャッシュ済みなら HIT し
      # build は走らない。
      - name: Cache dev-client APK
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.APK_PATH }}
          key: e2e-android-devclient-apk-x86_64-${{ steps.fp.outputs.hash }}

      # キャッシュミス時のみビルドし、post ステップで actions/cache が default ブランチスコープへ保存する。
      # x86_64 のみビルドして PR 側 emulator（x86_64）と arch を一致させる。
      - name: Build dev-client APK (eas build --local)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/sandbox
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
          E2E_BUILD: 'true'
          E2E_DEFAULT_LOCALE: ja
        run: |
          eas build --local --profile development --platform android \
            --non-interactive --output ./build-output/sandbox-e2e-devclient.apk

      - name: Summarize APK cache result
        if: always()
        run: |
          if [ -z "${{ steps.fp.outputs.hash }}" ]; then
            echo "### dev-client APK cache: 判定不能（fingerprint の取得に失敗）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "### dev-client APK cache: HIT（最新 fingerprint がキャッシュ済み・温め不要）" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "fingerprint: \`${{ steps.fp.outputs.hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### dev-client APK cache: MISS（eas build --local を実行 → キャッシュに保存）" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "fingerprint: \`${{ steps.fp.outputs.hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
