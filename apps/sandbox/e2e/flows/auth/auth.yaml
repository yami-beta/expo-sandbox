# サインイン(グローバル /sign-in)→マイページ(/account、RequireAuthで保護)の E2E フロー。
# サインアウト後、/account がその場で RequireAuth の未認証表示に切り替わること(遷移しない)、
# /sign-in ⇔ /account の往復を2周しても遷移スタックが積み上がらないこと(2周目の終わりに
# back を1回押すだけで home まで戻れること)を検証する。
# /sign-in ⇔ /account はどちらも RequireAuth/SignInGate から replace で遷移しており
# (features/auth/RequireAuth.tsx・SignInGate.tsx 参照)、往復のたびに push で積み上がっていた
# 不具合の再発防止を兼ねる。
# アプリの起動（Dev Client か release かの分岐を含む）は common/launch-app.yaml に切り出してある
# （docs/maestro.md「フローの書き方」参照）。
# 表示テキストは lingui の <Trans>（sourceLocale=ja）。Maestro の assertVisible/tapOn は部分一致のため、
# 裸の「サインイン」は使わない: サインイン画面のタイトル「サインイン」・ボタン「サインインする」・
# 認証済み画面（マイページ）の本文「サインインしています。」がいずれも「サインイン」を部分文字列として
# 含み、サインアウトが機能せず認証済み画面に留まるバグがあっても誤ってパスしてしまうため。
# ボタン文言「サインインする」に統一して assertVisible/tapOn する。
# なお SignInScreen の本文（「タップすると即座にサインインするサンプルです…」）自体が
# 「サインインする」を部分文字列として含むため、tapOn は正規表現アンカー（^$）でボタン文言に
# 完全一致させ、本文を誤ってタップしないようにする。
appId: com.yamibeta.sandbox
---
- runFlow: ../../common/launch-app.yaml
- assertVisible: "ホーム"
- tapOn: "サインインのサンプル"
- assertVisible: "サインインする"
- tapOn: "^サインインする$"
- assertVisible: "マイページへ"
- tapOn: "マイページへ"
- assertVisible: "サインアウト"
- tapOn: "サインアウト"
- assertVisible: "このページの閲覧にはサインインが必要です。"
# 2周目: /sign-in ⇔ /account を再度往復してもスタックが積み上がらないことを確認する
- tapOn: "サインイン画面へ"
- assertVisible: "サインインする"
- tapOn: "^サインインする$"
- assertVisible: "マイページへ"
- tapOn: "マイページへ"
- assertVisible: "サインアウト"
- tapOn: "サインアウト"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- back
- assertVisible: "ホーム"
