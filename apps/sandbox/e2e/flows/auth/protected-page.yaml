# tab-a/protected(RequireAuth で既存ページに後付けした保護)の E2E フロー。
# 未認証で /tab-a/protected を開くと RequireAuth の未認証案内が表示され、そこから
# /sign-in へ Link で進んでサインインすると、ルート Stack の Stack.Protected が
# /sign-in を弾き、tab-a Stack top に残っていた /tab-a/protected に自動で戻り、
# RequireAuth の children ブランチ(認証済みコンテンツ)が描画されることを検証する。
#
# ローカル(Android エミュレータ)実機で「サインイン後、保護ページが自動的に開く」ことを
# ユーザーが確認済み(2026-07-22)。CI ではこれまで tap "タブA" を挟んだために既に active な
# tab の再タップで pop-to-root が起きて tab-a index に戻ってしまい、認証済みコンテンツを
# assert できなかった。tap "タブA" を省いてサインイン直後に直接 assert することで、
# ローカルと同じ状態を CI でも検証する。
# ここでの RequireAuth は replace を指定しない(既定 push)ので、未認証で開いた後 /sign-in
# にサインインすると、Stack.Protected 経由で元のページに戻ってこられる設計
# (features/auth/RequireAuth.tsx 参照)。
# アプリの起動（Dev Client か release かの分岐を含む）は common/launch-app.yaml に切り出してある
# （docs/maestro.md「フローの書き方」参照）。
# 表示テキストは lingui の <Trans>/t（sourceLocale=ja）。auth.yaml と同様、「サインインする」
# ボタンは本文中の同一部分文字列と誤爆しないよう正規表現アンカー（^$）で完全一致させる。
appId: com.yamibeta.sandbox
---
- runFlow: ../../common/launch-app.yaml
- assertVisible: "ホーム"
- tapOn: "タブA"
- tapOn: "保護ページへ"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- tapOn: "サインイン画面へ"
- assertVisible: "サインインする"
- tapOn: "^サインインする$"
- waitForAnimationToEnd:
    timeout: 5000
# 前回(711593c)の実行結果:
# - assertVisible "^保護ページ$" → PASS(/tab-a/protected の header に到達)
# - extendedWaitUntil "RequireAuth でラップされている" → FAIL(children 未描画)
# つまり /tab-a/protected には居るのに RequireAuth の children ブランチが描画されていない。
# 今回の diag: unauth 案内が可視化されているかを直接確認する。
# これが可視化されれば「session context の更新が RequireAuth まで届いていない」ことになる
# (session はグローバルに truthy になっているが RequireAuth 側は古い state で描画している)。
- assertVisible: "^保護ページ$"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- assertNotVisible: "RequireAuth でラップされている"
