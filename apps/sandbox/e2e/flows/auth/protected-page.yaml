# tab-a/protected(RequireAuth で既存ページに後付けした保護)の E2E フロー。
# 未認証で /tab-a/protected を開くと RequireAuth の未認証案内が表示され、そこから
# /sign-in へ Link で進めることを検証する(tab-a 固有の導線であり、他のタブとは
# 独立した Stack から到達できることの確認が主目的)。
#
# 「サインイン後、Stack.Protected 経由で /tab-a/protected に自動で戻り、RequireAuth の
# children ブランチ(認証済みコンテンツ)が描画される」という挙動自体は、ローカル実機での
# ユーザー確認、および CI 上の adb uiautomator dump による直接確認の両方で、正しく動作する
# ことを確認済み(2026-07-22)。ただし CI(google_atd + swiftshader_indirect のソフトウェア
# レンダラー)では、Stack.Protected の pop によるバックグラウンド画面の再描画を Maestro が
# 受動的ポーリングで観測するタイミングが環境依存で大きくばらつき(15秒/45秒/90秒いずれの
# extendedWaitUntil でも安定して検知できなかった)、E2E アサーションとしては信頼性が低い。
# この「サインイン後に認証済みコンテンツへ戻る」検証は、auth.yaml(/account の RequireAuth で
# 同じ分岐を検証済み)と RequireAuth.test.tsx(session 変化での3状態切り替えをユニットテストで
# 検証済み)で担保されているため、本フローでは対象外とする。
#
# ここでの RequireAuth は replace を指定しない(既定 push)ので、未認証で開いた後 /sign-in
# にサインインすると、Stack.Protected 経由で元のページに戻ってこられる設計
# (features/auth/RequireAuth.tsx 参照)。
# アプリの起動（Dev Client か release かの分岐を含む）は common/launch-app.yaml に切り出してある
# （docs/maestro.md「フローの書き方」参照）。
# 表示テキストは lingui の <Trans>/t（sourceLocale=ja）。auth.yaml と同様、「サインインする」
# ボタンは本文中の同一部分文字列と誤爆しないよう正規表現アンカー（^$）で完全一致させる。
appId: com.yamibeta.sandbox
---
- runFlow: ../../common/launch-app.yaml
- assertVisible: "ホーム"
- tapOn: "タブA"
- tapOn: "保護ページへ"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- tapOn: "サインイン画面へ"
- assertVisible: "サインインする"
