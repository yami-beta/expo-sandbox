# tab-a/protected(RequireAuth で既存ページに後付けした保護)の E2E フロー。
# 未認証で /tab-a/protected を開くと RequireAuth の案内表示になり、サインイン画面へ進んで
# サインインを行い、その後改めて /tab-a/protected を開くと RequireAuth の認証済み分岐で
# 保護対象コンテンツが表示されること、を検証する。
# 起動〜サインイン後の active tab / tab 内 Stack の状態は、ルートStackの Stack.Protected
# フォールバック実装に依存して確約できないため、サインイン後はタブAと保護ページを明示的に
# 選び直す(元々の意図「認証が通ればRequireAuth が children を描画する」検証は保持される)。
# ここでの RequireAuth は replace を指定しない(既定 push)ので、未認証状態のまま戻るボタンを
# 押した場合は元のページに戻れる設計(auth.yaml が検証する /sign-in ⇔ /account の replace 遷移
# とは異なる経路。features/auth/RequireAuth.tsx 参照)。
# アプリの起動（Dev Client か release かの分岐を含む）は common/launch-app.yaml に切り出してある
# （docs/maestro.md「フローの書き方」参照）。
# 表示テキストは lingui の <Trans>/t（sourceLocale=ja）。auth.yaml と同様、「サインインする」
# ボタンは本文中の同一部分文字列と誤爆しないよう正規表現アンカー（^$）で完全一致させる。
appId: com.yamibeta.sandbox
---
- runFlow: ../../common/launch-app.yaml
- assertVisible: "ホーム"
- tapOn: "タブA"
- tapOn: "保護ページへ"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- tapOn: "サインイン画面へ"
- assertVisible: "サインインする"
- tapOn: "^サインインする$"
# サインイン成功: ルート Stack.Protected が /sign-in を弾き (tabs) に戻る。
# active tab / tab-a 内の Stack が保持されるとは限らないため、タブA→保護ページを再度辿って
# 認証済み状態の RequireAuth 分岐(children 描画)が表示されることを確認する
- assertVisible: "ホーム"                     # (tabs) の tab bar に戻ったことのアンカー
- tapOn: "タブA"
- tapOn: "保護ページへ"
- assertVisible: "RequireAuth でラップされている"
- assertNotVisible: "このページの閲覧にはサインインが必要です。"
