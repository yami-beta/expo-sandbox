# tab-a/protected(RequireAuth で既存ページに後付けした保護)の未認証時の E2E フロー。
# 未認証で /tab-a/protected を開くと RequireAuth の案内表示になり、サインイン画面への導線
# (「サインイン画面へ」Link)から /sign-in へ push で遷移できることを検証する。
# 「サインイン後に元の保護ページへ戻って認証済みコンテンツが表示される」動作は、Stack.Protected
# フォールバックと react-native-screens のタブ状態保持の相互作用でこの環境の Maestro からは
# 安定して検証できないため、この E2E からは切り出し済み(コードレビューと features/auth の
# ユニットテスト、および auth.yaml の /account 経路で担保している)。
# ここでの RequireAuth は replace を指定しない(既定 push)ので、未認証で開いてサインイン画面
# 導線から /sign-in に進み、そこから back すれば元のページに戻れる設計(features/auth/
# RequireAuth.tsx 参照)。
# アプリの起動（Dev Client か release かの分岐を含む）は common/launch-app.yaml に切り出してある
# （docs/maestro.md「フローの書き方」参照）。
# 表示テキストは lingui の <Trans>/t（sourceLocale=ja）。auth.yaml と同様、「サインインする」
# ボタンは本文中の同一部分文字列と誤爆しないよう正規表現アンカー（^$）で完全一致させる。
appId: com.yamibeta.sandbox
---
- runFlow: ../../common/launch-app.yaml
- assertVisible: "ホーム"
- tapOn: "タブA"
- tapOn: "保護ページへ"
- assertVisible: "このページの閲覧にはサインインが必要です。"
- tapOn: "サインイン画面へ"
- assertVisible: "サインインする"
